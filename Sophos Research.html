        const IvSurfaceCanvas = () => {
            const canvasRef = useRef(null);
            const dateRef = useRef(null);
            const atmRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const parent = canvas.parentElement;
                let raf = 0;
                const m = IV_SURFACE.moneyness;
                const dte = IV_SURFACE.dte;
                const n = IV_SURFACE.dates.length;
                const MD = 64;
                const DD = 44;
                let amin = Infinity;
                let amax = -Infinity;
                IV_SURFACE.atm.forEach((v) => {
                    amin = Math.min(amin, v);
                    amax = Math.max(amax, v);
                });

                const wrap = (i) => ((i % n) + n) % n;
                const catmull = (p0, p1, p2, p3, t) => {
                    const t2 = t * t;
                    const t3 = t2 * t;
                    return 0.5 * ((2 * p1) + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3);
                };
                const at = (g, j, i) => {
                    const jj = Math.max(0, Math.min(g.length - 1, j));
                    const ii = Math.max(0, Math.min(g[0].length - 1, i));
                    return g[jj][ii];
                };
                const heightN = (z) => {
                    const x = Math.max(0.04, z) - 0.05;
                    const n = Math.asinh(x / 0.11) / Math.asinh(0.85 / 0.11);
                    return 0.07 + 0.88 * Math.max(0, Math.min(1, n));
                };
                const color = (z) => {
                    const t = Math.max(0, Math.min(1, heightN(z)));
                    return [Math.round(36 + t * 175), Math.round(130 + t * 70), Math.round(185 + t * 55)];
                };
                const densify = (coarse) => {
                    const nr = dte.length;
                    const nc = m.length;
                    const out = [];
                    for (let j = 0; j < DD; j++) {
                        const vv = (j / (DD - 1)) * (nr - 1);
                        const j1 = Math.max(0, Math.min(nr - 2, Math.floor(vv)));
                        const tf = vv - j1;
                        const row = [];
                        for (let i = 0; i < MD; i++) {
                            const uu = (i / (MD - 1)) * (nc - 1);
                            const i1 = Math.max(0, Math.min(nc - 2, Math.floor(uu)));
                            const sf = uu - i1;
                            const cols = [];
                            for (let k = -1; k <= 2; k++) {
                                cols.push(catmull(
                                    at(coarse, j1 + k, i1 - 1),
                                    at(coarse, j1 + k, i1),
                                    at(coarse, j1 + k, i1 + 1),
                                    at(coarse, j1 + k, i1 + 2),
                                    sf
                                ));
                            }
                            row.push(catmull(cols[0], cols[1], cols[2], cols[3], tf));
                        }
                        out.push(row);
                    }
                    return out;
                };
                const projector = (x0, y0, x1, y1) => {
                    const planeH = (y1 - y0) * 0.30;
                    const head = (y1 - y0) * 0.50;
                    const padB = (y1 - y0) * 0.05;
                    const yFront = y0 + head + planeH + padB;
                    const xSkew = (x1 - x0) * 0.20;
                    return (u, v, z) => {
                        const x = x0 + u * (x1 - x0 - xSkew) + v * xSkew;
                        const yFloor = yFront - v * planeH;
                        return [x, yFloor - heightN(z) * head];
                    };
                };

                let acc = null;
                let zHiS = null;
                const draw = (now) => {
                    const w = parent.clientWidth;
                    const h = parent.clientHeight;
                    if (w < 32 || h < 32) {
                        raf = requestAnimationFrame(draw);
                        return;
                    }
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const bw = Math.floor(w * dpr);
                    const bh = Math.floor(h * dpr);
                    if (canvas.width !== bw || canvas.height !== bh) {
                        canvas.width = bw;
                        canvas.height = bh;
                    }
                    canvas.style.width = w + 'px';
                    canvas.style.height = h + 'px';
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.clearRect(0, 0, w, h);
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'alphabetic';

                    const speed = 130;
                    const phase = (now / speed) % n;
                    const i0 = Math.floor(phase) % n;
                    const i1 = wrap(i0 + 1);
                    const frac = phase - Math.floor(phase);
                    const g0 = IV_SURFACE.iv[i0];
                    const g1 = IV_SURFACE.iv[i1];
                    const coarse = g0.map((row, ri) => row.map((v, ci) => v + (g1[ri][ci] - v) * frac));
                    const target = densify(coarse);
                    if (!acc) {
                        acc = target.map((row) => row.slice());
                    } else {
                        for (let j = 0; j < DD; j++) {
                            for (let i = 0; i < MD; i++) {
                                acc[j][i] += (target[j][i] - acc[j][i]) * 0.22;
                            }
                        }
                    }
                    const grid = acc;
                    const atm = IV_SURFACE.atm[i0] + (IV_SURFACE.atm[i1] - IV_SURFACE.atm[i0]) * frac;
                    if (dateRef.current) dateRef.current.textContent = IV_SURFACE.dates[i0];
                    if (atmRef.current) atmRef.current.textContent = (atm * 100).toFixed(1) + '% ATM';

                    let zHi = -Infinity;
                    for (let j = 0; j < DD; j++) {
                        for (let i = 0; i < MD; i++) {
                            zHi = Math.max(zHi, grid[j][i]);
                        }
                    }
                    if (zHiS == null) zHiS = zHi;
                    else zHiS += (zHi - zHiS) * 0.08;
                    const project = projector(36, 10, w - 12, h - 48);
                    const fl = [
                        project(0, 0, 0.05),
                        project(1, 0, 0.05),
                        project(1, 1, 0.05),
                        project(0, 1, 0.05)
                    ];
                    ctx.beginPath();
                    ctx.moveTo(fl[0][0], fl[0][1]);
                    fl.slice(1).forEach((p) => ctx.lineTo(p[0], p[1]));
                    ctx.closePath();
                    ctx.fillStyle = 'rgba(18, 21, 27, 0.9)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(46, 54, 70, 0.95)';
                    ctx.stroke();

                    for (let di = DD - 2; di >= 0; di--) {
                        for (let mi = 0; mi < MD - 1; mi++) {
                            const u0 = mi / (MD - 1);
                            const u1 = (mi + 1) / (MD - 1);
                            const v0 = di / (DD - 1);
                            const v1 = (di + 1) / (DD - 1);
                            const z00 = grid[di][mi];
                            const z10 = grid[di][mi + 1];
                            const z01 = grid[di + 1][mi];
                            const z11 = grid[di + 1][mi + 1];
                            const p00 = project(u0, v0, z00);
                            const p10 = project(u1, v0, z10);
                            const p01 = project(u0, v1, z01);
                            const p11 = project(u1, v1, z11);
                            const [r, g, bl] = color((z00 + z10 + z01 + z11) / 4);
                            ctx.beginPath();
                            ctx.moveTo(p00[0], p00[1]);
                            ctx.lineTo(p10[0], p10[1]);
                            ctx.lineTo(p11[0], p11[1]);
                            ctx.lineTo(p01[0], p01[1]);
                            ctx.closePath();
                            ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + bl + ',0.97)';
                            ctx.fill();
                            if (di % 4 === 0 || mi % 4 === 0) {
                                ctx.strokeStyle = 'rgba(11,13,16,0.12)';
                                ctx.lineWidth = 0.35;
                                ctx.stroke();
                            }
                        }
                    }

                    ctx.fillStyle = '#8A99AD';
                    ctx.font = '9px JetBrains Mono, monospace';
                    const p80 = project(0, 0, grid[0][0]);
                    const p120 = project(1, 0, grid[0][MD - 1]);
                    const p365 = project(0, 1, grid[DD - 1][0]);
                    ctx.fillText('0.80', p80[0] - 2, p80[1] + 14);
                    ctx.fillText('K/S 1.20', p120[0] - 44, p120[1] + 14);
                    ctx.fillText('365d', p365[0] - 6, p365[1] - 6);
                    ctx.fillText('30d', p80[0] - 24, p80[1] - 4);
                    ctx.fillText((zHiS * 100).toFixed(0) + '%', p80[0] - 4, project(0, 0, zHiS)[1] - 4);

                    const tlY = h - 20;
                    const tlL = 44;
                    const tlR = w - 12;
                    ctx.strokeStyle = 'rgba(46, 54, 70, 0.95)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(tlL, tlY);
                    ctx.lineTo(tlR, tlY);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(56, 189, 248, 0.55)';
                    ctx.lineWidth = 1.3;
                    IV_SURFACE.atm.forEach((v, i) => {
                        const tx = tlL + (i / (n - 1)) * (tlR - tlL);
                        const ty = tlY - 8 - ((v - amin) / (amax - amin)) * 16;
                        if (i === 0) ctx.moveTo(tx, ty);
                        else ctx.lineTo(tx, ty);
                    });
                    ctx.stroke();
                    ctx.fillStyle = '#8A99AD';
                    ctx.textAlign = 'center';
                    const years = [];
                    IV_SURFACE.dates.forEach((d, i) => {
                        const y = d.slice(0, 4);
                        if (!years.length || years[years.length - 1][0] !== y) years.push([y, i]);
                    });
                    years.forEach(([y, i]) => {
                        const tx = tlL + (i / (n - 1)) * (tlR - tlL);
                        ctx.fillText(y, tx, tlY + 12);
                    });
                    ctx.textAlign = 'left';
                    ctx.fillText('ATM', 8, tlY - 14);

                    const hx = tlL + ((i0 + frac) / (n - 1)) * (tlR - tlL);
                    ctx.strokeStyle = '#38BDF8';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(hx, tlY - 22);
                    ctx.lineTo(hx, tlY + 3);
                    ctx.stroke();
                    ctx.fillStyle = '#38BDF8';
                    ctx.beginPath();
                    ctx.arc(hx, tlY, 3, 0, Math.PI * 2);
                    ctx.fill();

                    raf = requestAnimationFrame(draw);
                };
                raf = requestAnimationFrame(draw);
                return () => cancelAnimationFrame(raf);
            }, []);

            return (
                <div className="relative w-full h-[520px] lg:h-[580px] border border-sophos-border rounded bg-sophos-card/40 overflow-hidden flex flex-col">
                    <div className="flex items-center justify-between z-10 px-4 py-2.5 border-b border-sophos-border/60">
                        <div className="flex items-center space-x-2 font-code text-xs text-sophos-muted">
                            <span className="inline-block w-2 h-2 rounded-full bg-sophos-accent animate-pulse"></span>
                            <span>SPY IV SURFACE</span>
                        </div>
                        <div className="font-code text-[11px] text-sophos-muted/80 tracking-wider space-x-3">
                            <span ref={dateRef}>2020-01-02</span>
                            <span ref={atmRef} className="text-sophos-accent"></span>
                        </div>
                    </div>
                    <div className="relative flex-1 min-h-0">
                        <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />
                    </div>
                    <div className="z-10 flex justify-between px-4 py-2 border-t border-sophos-border/40 font-code text-[11px] text-sophos-muted">
                        <span>OTM PUTS K/S &lt; 1 · OTM CALLS K/S ≥ 1</span>
                        <span>DAILY 2020–2021</span>
                    </div>
                </div>
            );
        };

        const QuantHeroCanvas = () => {
            const canvasRef = useRef(null);
            const [sid, setSid] = useState(LS_STRATS[0].id);
            const series = LS_STRATS.find((s) => s.id === sid) || LS_STRATS[0];
            const pack = useMemo(() => {
                const qs = [series.q1, series.q2, series.q3, series.q4, series.q5];
                const all = [...qs, series.ls];
                let ymin = Infinity;
                let ymax = -Infinity;
                all.forEach((s) => s.forEach((v) => {
                    ymin = Math.min(ymin, Math.log(v));
                    ymax = Math.max(ymax, Math.log(v));
                }));
                const pad = (ymax - ymin) * 0.08;
                return {
                    qs,
                    ls: series.ls,
                    dates: series.dates,
                    n: series.ls.length - 1,
                    ymin: ymin - pad,
                    ymax: ymax + pad
                };
            }, [series]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const parent = canvas.parentElement;
                let raf = 0;
                const t0 = performance.now();

                const qColors = [
                    'rgba(100, 116, 139, 0.85)',
                    'rgba(148, 163, 184, 0.75)',
                    'rgba(186, 198, 214, 0.7)',
                    'rgba(203, 213, 225, 0.8)',
                    'rgba(226, 232, 240, 0.95)'
                ];

                const render = (now) => {
                    const width = parent.clientWidth;
                    const height = parent.clientHeight;
                    if (width < 32 || height < 32) {
                        raf = requestAnimationFrame(render);
                        return;
                    }
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    const bw = Math.floor(width * dpr);
                    const bh = Math.floor(height * dpr);
                    if (canvas.width !== bw || canvas.height !== bh) {
                        canvas.width = bw;
                        canvas.height = bh;
                    }
                    canvas.style.width = width + 'px';
                    canvas.style.height = height + 'px';
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    ctx.clearRect(0, 0, width, height);

                    const reveal = Math.min(1, (now - t0) / 7500);
                    const k = Math.max(2, Math.floor(1 + reveal * pack.n));
                    const L = 44;
                    const R = width - 16;
                    const T = 10;
                    const B = height - 24;
                    const plotW = R - L;
                    const plotH = B - T;
                    const yAt = (v) => T + plotH * (1 - (Math.log(v) - pack.ymin) / (pack.ymax - pack.ymin));
                    const xAt = (i) => L + (plotW * i) / pack.n;

                    ctx.strokeStyle = 'rgba(30, 35, 45, 0.55)';
                    ctx.lineWidth = 1;
                    for (let i = 0; i <= 3; i++) {
                        const y = T + plotH * (i / 3);
                        ctx.beginPath();
                        ctx.moveTo(L, y);
                        ctx.lineTo(R, y);
                        ctx.stroke();
                    }

                    const draw = (s, color, lw) => {
                        ctx.beginPath();
                        ctx.strokeStyle = color;
                        ctx.lineWidth = lw;
                        ctx.lineJoin = 'round';
                        for (let i = 0; i <= k; i++) {
                            const x = xAt(i);
                            const y = yAt(s[i]);
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    };

                    pack.qs.forEach((s, q) => draw(s, qColors[q], 1.15));
                    draw(pack.ls, 'rgba(56, 189, 248, 0.95)', 2.1);
                    ctx.fillStyle = '#38BDF8';
                    ctx.beginPath();
                    ctx.arc(xAt(k), yAt(pack.ls[k]), 2.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#8A99AD';
                    ctx.font = '9px JetBrains Mono, monospace';
                    ctx.textAlign = 'right';
                    ctx.fillText('log NAV', L - 6, T + 8);
                    ctx.textAlign = 'center';
                    ctx.fillText(pack.dates[0].slice(0, 4), xAt(0), B + 14);
                    const yStart = parseInt(pack.dates[0].slice(0, 4), 10);
                    const yEnd = parseInt(pack.dates[pack.dates.length - 1].slice(0, 4), 10);
                    for (let y = Math.ceil((yStart + 1) / 10) * 10; y <= yEnd; y += 10) {
                        const i = pack.dates.indexOf(String(y) + '-01');
                        if (i > 0) ctx.fillText(String(y), xAt(i), B + 14);
                    }
                    ctx.textAlign = 'left';

                    raf = requestAnimationFrame(render);
                };
                raf = requestAnimationFrame(render);
                return () => cancelAnimationFrame(raf);
            }, [pack]);

            const start = series.dates[0];
            const end = series.dates[series.dates.length - 1];
            const startLab = start.slice(0, 4) + ' ' + ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][parseInt(start.slice(5, 7), 10) - 1];
            const endLab = end.slice(0, 4) + ' ' + ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][parseInt(end.slice(5, 7), 10) - 1];

            return (
                <div className="relative w-full h-[320px] lg:h-[380px] border border-sophos-border rounded bg-sophos-card/40 overflow-hidden flex flex-col">
                    <div className="flex items-center justify-between z-10 px-4 py-2 border-b border-sophos-border/60 gap-3">
                        <div className="flex items-center space-x-2 font-code text-xs text-sophos-muted min-w-0">
                            <span className="inline-block w-2 h-2 rounded-full bg-sophos-accent"></span>
                            <span>QUINTILES</span>
                        </div>
                        <select
                            value={sid}
                            onChange={(e) => setSid(e.target.value)}

                        >
                            {LS_STRATS.map((s) => (
                                <option key={s.id} value={s.id}>{s.title}</option>
                            ))}
                        </select>
                    </div>
                    <div className="relative flex-1 min-h-0">
                        <canvas ref={canvasRef} className="absolute inset-0 w-full h-full" />
                    </div>
                    <div className="z-10 flex justify-between px-4 py-2 border-t border-sophos-border/40 font-code text-[11px] text-sophos-muted">
                        <span>Q1 → Q5 · <span className="text-sophos-accent">LS</span> Q5 − Q1</span>
                        <span>{startLab} – {endLab}</span>
                    </div>
                </div>
            );
        };
